{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header bg-warning">
                    <h4>Team Leader Evaluation</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <strong>Employee:</strong> {{ employee.name }} | 
                        <strong>Department:</strong> {{ employee.dept_name }} |
                        <strong>Role:</strong> {{ employee.role_name }}
                    </div>
                    
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Work Quality (1-5)</label>
                                <select name="work_quality" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }} - {% if i==1 %}Poor{% elif i==2 %}Fair{% elif i==3 %}Good{% elif i==4 %}Very Good{% else %}Excellent{% endif %}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Productivity (1-5)</label>
                                <select name="productivity" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Attendance % (0-100)</label>
                                <input type="number" name="attendance" class="form-control" min="0" max="100" step="0.1" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Teamwork (1-5)</label>
                                <select name="teamwork" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Communication (1-5)</label>
                                <select name="communication" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Task Completion (1-5)</label>
                                <select name="task_completion" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Problem Solving (1-5)</label>
                                <select name="problem_solving" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Initiative (1-5)</label>
                                <select name="initiative" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Adaptability (1-5)</label>
                                <select name="adaptability" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label>Deadline Adherence (1-5)</label>
                                <select name="deadline" class="form-control" required>
                                    <option value="">Select</option>
                                    {% for i in range(1,6) %}
                                    <option value="{{ i }}">{{ i }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary">Submit Evaluation</button>
                            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
